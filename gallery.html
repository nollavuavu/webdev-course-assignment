<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gallery &#183; Coursi</title>
</head>
<body>
    <div class="header">
        <div class="left-section">
            <a class="logo" href="index.html">
                <img src="media/logo.png" alt="Coursi" class="logo-image">
            </a>
        </div>

        <div class="right-section">
            <a class="contact" href="contact.html">Contact</a>
            <a class="gallery" href="gallery.html">Gallery</a>
        </div>
    </div>

    <main class="page">
        <picture class="device-image">
            <source srcset="media/phone.png" media="(max-width: 600px)">
            <source srcset="media/tablet.png" media="(max-width: 1024px)">

            <img src="media/desktop.png" alt="Device">
        </picture>
        <div class="gallery-container">
            <div class="gallery-thumbnails">
                <a href="media/logo.jpg" target="gallery-frame">
                    <img class="gallery-thumbnail" src="media/logo.jpg" alt="Coursi logo">
                </a>

                <a href="media/mockup.jpg" target="gallery-frame">
                    <img class="gallery-thumbnail" src="media/mockup.jpg" alt="Mockup">
                </a>

                <a href="media/map.jpg" target="gallery-frame">
                    <img class="gallery-thumbnail" src="media/map.jpg" alt="Map">
                </a>

                <a href="media/lc.png" target="gallery-frame">
                    <img class="gallery-thumbnail" src="media/lc.png" alt="Leetcode">
                </a>

                <a href="media/ceo.jpg" target="gallery-frame">
                    <img class="gallery-thumbnail" src="media/ceo.jpg" alt="CEO">
                </a>
            </div>

            <div>
                <iframe class="gallery-frame" name="gallery-frame" src="media/logo.jpg" title="Selected Gallery Image"></iframe>
            </div>
        </div>

        <div>
            <iframe class="film" src="https://vidfast.vc/movie/tt0050083?autoPlay=false" title="12 Angry Men"> </iframe>
        </div>
    </main>
</body>
</html>
