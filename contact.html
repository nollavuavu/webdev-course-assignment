<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Contact &#183; Coursi</title>
</head>
<body>
    <div class="header">
        <div class="left-section">
            <a class="logo" href="index.html">
                <img src="media/logo.png" alt="Coursi" class="logo-image">
            </a>
        </div>
        <div class="right-section">
            <a class="contact" href="contact.html">Contact</a>
            <a class="gallery" href="gallery.html">Gallery</a>
        </div>
    </div>

    <main>
        <div class="contact-container">
            <div class="contact-form">
                <div class="contact-title">
                    <h1>Contact us</h1>
                    <h2>coursi.web@gmail.com</h2>
                </div>
                <form action="https://formspree.io/f/xyezjdda" method="POST">
                    <label>
                        Your email:
                        <input type="email" name="email" placeholder="user123@gmail.com">
                    </label>

                    <label>
                        Your message:
                        <textarea name="message" placeholder="Type your message here..." required></textarea>
                    </label>

                    <button type="submit">Send Message</button>
                </form>
            </div>
            <div class="contact-map">
                <div class="contact-title">
                    <h1>Find us here</h1>

                    <iframe width="425" height="350" src="https://www.openstreetmap.org/export/embed.html?bbox=24.965609908103946%2C60.200386946581894%2C24.970631003379822%2C60.202189075668294&layer=mapnik&marker=60.201288023497405%2C24.968120455741882"></iframe>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
